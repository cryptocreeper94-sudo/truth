<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truth Observatory — Mission Control</title>
  <meta name="description" content="18-stream atmospheric, geophysical, and infrastructure monitoring cockpit. Live feeds, cross-feed correlation, SHA-256 integrity. The system watches. The data decides.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
</head>
<body>
  <!-- ═══ TOP STATUS BAR ═══ -->
  <header class="topbar" id="topbar">
    <div class="topbar__left">
      <span class="topbar__logo">◉</span>
      <span class="topbar__title">TRUTH OBSERVATORY</span>
      <span class="topbar__version">v2.0</span>
    </div>
    <div class="topbar__center">
      <div class="topbar__stat">
        <span class="topbar__stat-label">FEEDS</span>
        <span class="topbar__stat-value" id="stat-live">—/18</span>
      </div>
      <div class="topbar__stat">
        <span class="topbar__stat-label">CORRELATION</span>
        <span class="topbar__stat-value" id="stat-corr">MODELING</span>
      </div>
      <div class="topbar__stat">
        <span class="topbar__stat-label">RETENTION</span>
        <span class="topbar__stat-value" id="stat-retention">4H</span>
      </div>
    </div>
    <div class="topbar__right">
      <span class="topbar__clock" id="utc-clock">00:00:00 UTC</span>
      <span class="topbar__pulse" id="global-pulse"></span>
    </div>
  </header>

  <!-- ═══ MAIN COCKPIT ═══ -->
  <main class="cockpit" id="cockpit">

    <!-- LEFT: MAP PANEL -->
    <section class="cockpit__map" id="map-panel">
      <div class="panel-header">
        <span class="panel-header__icon">◎</span>
        <span class="panel-header__title">GEOSPATIAL OVERLAY</span>
        <span class="panel-header__badge" id="map-layers">0 layers</span>
      </div>
      <div id="map" class="map-container"></div>
    </section>

    <!-- RIGHT: BENTO GRID -->
    <section class="cockpit__feeds" id="feeds-panel">
      <div class="panel-header">
        <span class="panel-header__icon">▣</span>
        <span class="panel-header__title">DATA STREAMS</span>
        <div class="panel-header__filters" id="domain-filters">
          <button class="filter-btn filter-btn--active" data-domain="all">ALL</button>
          <button class="filter-btn" data-domain="Atmospheric">ATMO</button>
          <button class="filter-btn" data-domain="Space Weather">SPACE</button>
          <button class="filter-btn" data-domain="Infrastructure">INFRA</button>
          <button class="filter-btn" data-domain="Geological">GEO</button>
          <button class="filter-btn" data-domain="Ecological">ECO</button>
        </div>
      </div>
      <div class="bento-grid" id="bento-grid">
        <!-- Tiles injected by JS -->
      </div>
    </section>

    <!-- BOTTOM: CORRELATION BAR -->
    <section class="cockpit__corr" id="corr-panel">
      <div class="panel-header">
        <span class="panel-header__icon">⟁</span>
        <span class="panel-header__title">CORRELATION ENGINE</span>
        <span class="panel-header__badge" id="corr-count">0 patterns</span>
      </div>
      <div class="corr-carousel" id="corr-carousel">
        <div class="corr-carousel__track" id="corr-track">
          <div class="corr-card corr-card--empty">
            <p class="corr-card__msg">Correlation engine is modeling baselines. Patterns appear as deviations are identified.</p>
          </div>
        </div>
        <div class="corr-carousel__nav">
          <button class="corr-nav-btn" id="corr-prev">‹</button>
          <div class="corr-carousel__dots" id="corr-dots"></div>
          <button class="corr-nav-btn" id="corr-next">›</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ═══ DETAIL MODAL ═══ -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="detail-modal">
      <div class="modal__header">
        <div class="modal__title-row">
          <span class="modal__icon" id="modal-icon"></span>
          <h2 class="modal__title" id="modal-title"></h2>
          <span class="modal__badge" id="modal-badge"></span>
        </div>
        <button class="modal__close" id="modal-close">✕</button>
      </div>
      <div class="modal__body">
        <div class="modal__meta" id="modal-meta"></div>
        <div class="modal__sparkline-lg">
          <canvas id="modal-sparkline" width="600" height="120"></canvas>
          <span class="modal__sparkline-label">24-HOUR ACTIVITY</span>
        </div>
        <div class="modal__entries" id="modal-entries">
          <h3 class="modal__section-title">RECENT OBSERVATIONS</h3>
          <div class="modal__entry-list" id="modal-entry-list"></div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="modal__back-btn" id="modal-back">← BACK TO COCKPIT</button>
      </div>
    </div>
  </div>

  <!-- ═══ BOTTOM NAV ═══ -->
  <nav class="bottomnav" id="bottomnav">
    <button class="bottomnav__btn bottomnav__btn--active" data-view="cockpit">
      <span class="bottomnav__icon">◉</span>
      <span class="bottomnav__label">Cockpit</span>
    </button>
    <button class="bottomnav__btn" data-view="feeds">
      <span class="bottomnav__icon">▣</span>
      <span class="bottomnav__label">Feeds</span>
    </button>
    <button class="bottomnav__btn" data-view="correlations">
      <span class="bottomnav__icon">⟁</span>
      <span class="bottomnav__label">Correlations</span>
    </button>
    <button class="bottomnav__btn" data-view="map">
      <span class="bottomnav__icon">◎</span>
      <span class="bottomnav__label">Map</span>
    </button>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
